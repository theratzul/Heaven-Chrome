name: Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute Build Version
        id: versioning
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building Heaven Chrome version: ${VERSION}"

      # -----------------------------------------------
      # 1. Android Build (Single Release APK)
      # -----------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Node Dependencies
        run: npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # -----------------------------------------------
      # 2. Linux & Steam Build
      # -----------------------------------------------
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libsdl2-dev zip

      - name: Build Linux Steam Package
        run: |
          chmod +x build-linux.sh run-linux.sh
          ./build-linux.sh
          make -C linux package

      # -----------------------------------------------
      # 3. Windows 11 & Steam Build (MinGW Cross-compile)
      # -----------------------------------------------
      - name: Install MinGW Cross-Compiler
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build Windows 11 Steam Package
        run: |
          chmod +x build-windows.sh run-windows.sh
          ./build-windows.sh

      # -----------------------------------------------
      # 4. Docker Build & Push
      # -----------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/heaven-chrome:latest
            ghcr.io/${{ github.repository_owner }}/heaven-chrome:${{ steps.versioning.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/heaven-chrome:${{ github.sha }}

      # -----------------------------------------------
      # 5. Create GitHub Release with All Artifacts
      # -----------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.version }}
          name: Heaven Chrome ${{ steps.versioning.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/Heaven-Chrome.apk
            linux/heaven-chrome-linux.tar.gz
            windows/heaven-chrome-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
