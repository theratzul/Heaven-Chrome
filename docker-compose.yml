version: '3.8'

services:
  heaven-chrome:
    build:
      context: .
      dockerfile: Dockerfile
    image: heaven-chrome:latest
    container_name: heaven-chrome-web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
