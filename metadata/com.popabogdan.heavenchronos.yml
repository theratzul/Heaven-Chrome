AutoName: Heaven Chrome
Summary: A divine time-bending puzzle adventure across 20 heavenly realms
Description: |-
  Heaven Chrome is an open-source time-manipulation action puzzle adventure
  where the player guides an angelic soul through perilous heavenly realms.
  Slow down time, dodge demonic hazards, rescue Guardian Angels, and ascend
  through 20 handcrafted realms to reach eternal paradise.

