apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: heaven-chrome
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/theratzul/Heaven-Chrome.git
    targetRevision: HEAD
    path: helm/heaven-chrome
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
