<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heaven Chrome - Web Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- Sun rays background -->
        <div class="sun-rays"></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui-layer">
            <div id="hud">
                <div class="hud-item">FAITH SCORE: <span id="scoreVal">0</span></div>
                <div class="hud-item">SOULS: <span id="livesVal">3</span></div>
                <div class="hud-item">DIVINE GRACE: <div class="energy-bar"><div id="energyFill"></div></div></div>
            </div>
            <div id="overlay" class="screen">
                <div class="cross-icon">✝</div>
                <h1 id="titleText">HEAVEN CHROME</h1>
                <p id="subText">A Divine Time-Bending Journey</p>
                <p style="color: #FFD700; font-size: 18px; font-weight: bold; margin-top: -20px; margin-bottom: 30px;">by popa bogdan</p>
                <div class="controls">
                    <p>Q/A or W/S - Ascend/Descend</p>
                    <p>O/P or A/D - Move Left/Right</p>
                    <p>SPACE - Divine Time Shift (Slow)</p>
                    <p>M - Pause</p>
                </div>
                <p class="blink">Press SPACE to Begin Your Journey</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
